<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essays &amp; LinkedIn Archive · Soneesh</title>
<meta name="description" content="All of Soneesh's LinkedIn posts, with reactions, comments, reposts, and impressions.">
<link rel="canonical" href="https://soneeshk.com/archive">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#fafaf9;--fg:#0a0a0a;--muted:#8a8a87;--in:#e9e9eb;--out:#0a84ff;--card:#fff;--edge:#e4e4e1}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0a;--fg:#f5f5f4;--muted:#71716e;--in:#262628;--card:#161617;--edge:#2c2c2e}}
:root[data-theme=dark]{--bg:#0a0a0a;--fg:#f5f5f4;--muted:#71716e;--in:#262628;--card:#161617;--edge:#2c2c2e}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 17px/1.5 Figtree,"Google Sans",system-ui,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  padding:calc(48px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto}
.back{color:var(--out);text-decoration:none;font-size:15px}
.back:hover{text-decoration:underline}
h1{font-weight:500;font-size:clamp(30px,6vw,40px);letter-spacing:-.02em;margin:18px 0 6px;line-height:1.15}
.lede{color:var(--muted);font-size:15px}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}
.tot{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 14px}
.tot b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tot span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.totals{grid-template-columns:repeat(2,1fr)}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 12px}
.bar h2{font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sort{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--in)}
.sort button{all:unset;cursor:pointer;font-size:13px;padding:5px 10px;border-radius:8px;color:var(--muted)}
.sort button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sort button:focus-visible{outline:2px solid var(--out)}
.post{background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:18px 18px 14px;margin-top:12px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.meta a{color:var(--out);text-decoration:none;white-space:nowrap}
.meta a:hover{text-decoration:underline}
.shared{font-size:13px;color:var(--muted);margin-top:8px}
.text{margin-top:8px;white-space:pre-line;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.text.clip{max-height:9.4em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.more{all:unset;cursor:pointer;font-size:14px;color:var(--out);margin-top:4px}
.poll{margin-top:10px;display:grid;gap:6px}
.opt{position:relative;border-radius:10px;background:var(--in);padding:8px 12px;font-size:15px;overflow:hidden;display:flex;justify-content:space-between}
.opt i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--out) 22%,transparent)}
.opt span{position:relative}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--edge);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
.top{display:inline-block;margin-left:6px;font-size:11px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.loadmore{all:unset;cursor:pointer;display:block;margin:16px auto 0;padding:10px 18px;border-radius:999px;background:var(--in);font-size:14px;color:var(--fg)}
.loadmore:focus-visible{outline:2px solid var(--out)}
footer{margin-top:36px;font-size:12px;color:var(--muted)}
footer a{color:var(--out);text-decoration:none}
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Soneesh</a>
  <h1>Essays &amp; LinkedIn Archive</h1>
  <p class="lede">Everything I've posted on LinkedIn, with the numbers.</p>
  <div class="totals" id="totals"></div>
  <div class="bar">
    <h2 id="count">Posts</h2>
    <div class="sort" role="group" aria-label="Sort posts">
      <button type="button" data-sort="new" aria-pressed="true">Newest</button>
      <button type="button" data-sort="imp" aria-pressed="false">Most seen</button>
      <button type="button" data-sort="eng" aria-pressed="false">Most engaged</button>
    </div>
  </div>
  <div id="list"></div>
  <button type="button" class="loadmore" id="loadmore" hidden>Show more posts</button>
  <footer>Numbers from LinkedIn as of <span id="asof"></span>. Full posts on <a href="https://www.linkedin.com/in/soneeshk/recent-activity/all/" target="_blank" rel="noopener">LinkedIn</a>.</footer>
</main>

<script>
(function(){
  // Data: archive-data.json = [[activityId, reactions, comments, reposts, impressions, excerpt], ...],
  // a snapshot of his own posts (no reposts/reshares). LinkedIn activity ids encode the post time (id >> 22 = ms).
  var AS_OF='2026-10-07';
  var POLLS={'7483729824922955776':{votes:410,options:[['Instagram',32],['LinkedIn',27],['Research Articles',20],['TV News / News Articles',21]]}};
  var PAGE=25,shown=PAGE,order='new',posts=[];
  var fmtN=function(n){return n>=1e6?(n/1e6).toFixed(2).replace(/0$/,'')+'M':n>=1e4?(n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'K':n.toLocaleString('en-US')};
  var fmtD=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric'});
  var esc=function(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var list=document.getElementById('list'),more=document.getElementById('loadmore'),best;
  function card(p){
    var url='https://www.linkedin.com/feed/update/urn:li:activity:'+p.id+'/',text=p.text||'Photo post (no caption)',long=text.length>280,poll=POLLS[p.id];
    var h='<article class="post"><div class="meta"><span>'+fmtD.format(new Date(p.t))+(p.id===best?'<span class="top">Most seen</span>':'')+'</span>'
      +'<a href="'+url+'" target="_blank" rel="noopener">Read on LinkedIn ↗</a></div>'
      +'<div class="text'+(long?' clip':'')+'">'+esc(text)+'</div>';
    if(long)h+='<button type="button" class="more">Show more</button>';
    if(poll)h+='<div class="poll">'+poll.options.map(function(o){return '<div class="opt"><i style="width:'+o[1]+'%"></i><span>'+esc(o[0])+'</span><span>'+o[1]+'%</span></div>'}).join('')+'</div><div class="shared">'+poll.votes+' votes</div>';
    return h+'<div class="stats"><span><b>'+(p.impressions?p.impressions.toLocaleString('en-US'):'—')+'</b> impressions</span><span><b>'+p.reactions.toLocaleString('en-US')+'</b> reactions</span>'
      +'<span><b>'+p.comments.toLocaleString('en-US')+'</b> comments</span><span><b>'+p.reposts+'</b> reposts</span></div></article>';
  }
  function sorted(){
    return posts.slice().sort(order==='imp'?function(a,b){return b.impressions-a.impressions}:order==='eng'?function(a,b){return (b.reactions+b.comments+b.reposts)-(a.reactions+a.comments+a.reposts)}:function(a,b){return b.t-a.t});
  }
  function render(){
    list.innerHTML=sorted().slice(0,shown).map(card).join('');
    more.hidden=shown>=posts.length;
    more.textContent='Show more posts ('+(posts.length-Math.min(shown,posts.length))+' left)';
  }
  list.addEventListener('click',function(e){
    var b=e.target.closest('.more');if(!b)return;var t=b.previousElementSibling;
    b.textContent=t.classList.toggle('clip')?'Show more':'Show less';
  });
  more.onclick=function(){shown+=PAGE;render()};
  var btns=[].slice.call(document.querySelectorAll('.sort button'));
  btns.forEach(function(b){b.onclick=function(){btns.forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});order=b.dataset.sort;shown=PAGE;render()}});
  fetch('/archive-data.json').then(function(r){return r.json()}).then(function(rows){
    posts=rows.map(function(r){return{id:r[0],t:Number(BigInt(r[0])>>22n),reactions:r[1],comments:r[2],reposts:r[3],impressions:r[4],text:r[5]}});
    var sum=function(k){return posts.reduce(function(a,p){return a+p[k]},0)},imp=sum('impressions');
    document.getElementById('totals').innerHTML=[[fmtN(imp),'impressions'],[fmtN(sum('reactions')),'reactions'],[fmtN(sum('comments')),'comments'],
      [((sum('reactions')+sum('comments')+sum('reposts'))/imp*100).toFixed(1)+'%','engagement rate']]
      .map(function(x){return '<div class="tot"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('');
    document.getElementById('count').textContent=posts.length+' posts';
    document.getElementById('asof').textContent=fmtD.format(new Date(AS_OF+'T12:00:00Z'));
    best=posts.slice().sort(function(a,b){return b.impressions-a.impressions})[0].id;
    render();
  }).catch(function(){list.innerHTML='<p class="lede">Couldn\u2019t load posts. Try refreshing.</p>'});
})();
</script>
</body>
</html>
