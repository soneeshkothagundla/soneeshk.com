<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soneesh</title>
<meta name="description" content="Founder, investor, creator, and philanthropist.">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#fafaf9;--fg:#0a0a0a;--muted:#8a8a87;--line:#d4d4d0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0a;--fg:#f5f5f4;--muted:#71716e;--line:#333331}}
:root[data-theme=dark]{--bg:#0a0a0a;--fg:#f5f5f4;--muted:#71716e;--line:#333331}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 clamp(20px,2.6vw,26px)/1.5 Figtree,"Google Sans",system-ui,sans-serif;
  letter-spacing:-.01em;display:grid;place-items:center;padding:24px;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
main{max-width:34ch;width:100%}
p{opacity:0;transform:translateY(6px);animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
p+p{margin-top:.9em}
p:nth-child(2){animation-delay:.15s}p:nth-child(3){animation-delay:.3s}p:nth-child(4){animation-delay:.45s}
@keyframes in{to{opacity:1;transform:none}}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s .6s ease-in-out 1}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.say{color:var(--muted)}
a{color:inherit;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 100%/100% 1px no-repeat;transition:background-size .35s ease}
a:hover,a:focus-visible{background-size:100% 1px,100% 1px;outline:none}
button{position:fixed;top:20px;right:20px;width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;transition:color .2s}
button:hover{color:var(--fg)}
button svg{width:18px;height:18px}
.moon{display:none}
:root[data-theme=dark] .sun{display:none}:root[data-theme=dark] .moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sun{display:none}:root:not([data-theme=light]) .moon{display:block}}
@media (prefers-reduced-motion:reduce){p,.wave{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<button id="t" aria-label="Toggle light and dark mode">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<main>
  <p>Hi <span class="wave">👋</span></p>
  <p>I'm Soneesh <span class="say">(so niche)</span></p>
  <p>I'm a <a href="https://www.capsulelabs.space" target="_blank" rel="noopener">founder</a>, <a href="https://bostonsquareventures.com" target="_blank" rel="noopener">investor</a>, <a href="https://www.linkedin.com/in/soneeshk" target="_blank" rel="noopener">creator</a>, and <a href="https://chapter-two-bice.vercel.app" target="_blank" rel="noopener">philanthropist</a>.</p>
  <p>I'm also an <a href="https://www.amazon.com/Fasten-Your-Seatbelt-Changing-World/dp/B0G1SSKDZT" target="_blank" rel="noopener">author</a> and <a href="https://scholar.google.com/citations?user=pYouEJ8AAAAJ&amp;hl=en" target="_blank" rel="noopener">researcher</a>.</p>
</main>
<script>
document.getElementById('t').onclick=function(){var r=document.documentElement,
 d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches,n=d?'light':'dark';
 r.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};
</script>
</body>
</html>
