<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soneesh</title>
<meta name="description" content="Founder, investor, creator, author, researcher, and philanthropist.">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#fafaf9;--fg:#0a0a0a;--muted:#8a8a87;--in:#e9e9eb;--out:#0a84ff;--field:#fff;--edge:#dcdcd8;--err:#e5484d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0a;--fg:#f5f5f4;--muted:#71716e;--in:#262628;--field:#161617;--edge:#2c2c2e}}
:root[data-theme=dark]{--bg:#0a0a0a;--fg:#f5f5f4;--muted:#71716e;--in:#262628;--field:#161617;--edge:#2c2c2e}
*{margin:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:400 clamp(17px,2vw,19px)/1.4 Figtree,"Google Sans",system-ui,sans-serif;
  letter-spacing:-.005em;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;
  padding:max(96px,24vh) max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:400px;display:flex;flex-direction:column;gap:3px}

.b{max-width:85%;padding:9px 14px;border-radius:20px;word-wrap:break-word;width:fit-content;
  opacity:0;transform:translateY(8px) scale(.96);transform-origin:bottom left;transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.2)}
.b.in:not(.show){display:none}
.b.on{opacity:1;transform:none}
.in{background:var(--in);color:var(--fg);align-self:flex-start;border-bottom-left-radius:6px}
.in+.in{border-top-left-radius:6px}
.in.last{border-bottom-left-radius:20px;position:relative}
.out{background:var(--out);color:#fff;align-self:flex-end;transform-origin:bottom right;border-bottom-right-radius:6px;margin-top:14px;white-space:pre-wrap}
.out+.out{margin-top:3px}
.say{opacity:.55}
.wave{display:inline-block;transform-origin:70% 70%}
.on .wave{animation:wave 2s .3s ease-in-out 1}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.in a{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);
  text-underline-offset:3px;text-decoration-thickness:1px;transition:text-decoration-color .2s}
.in a:hover,.in a:focus-visible{text-decoration-color:currentColor;outline:none}

.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-2px)}}

.meta{align-self:flex-end;font-size:12px;color:var(--muted);margin-top:3px;min-height:16px}
.meta.err{color:var(--err)}
.meta button{all:unset;cursor:pointer;text-decoration:underline}

#reply{align-self:flex-start;margin-top:18px;font:inherit;font-size:15px;color:var(--out);background:none;border:0;cursor:pointer;
  padding:10px 2px;min-height:44px;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#reply.on{opacity:1;visibility:visible}
#reply:hover{text-decoration:underline;text-underline-offset:3px}

form{margin-top:16px;display:none;flex-direction:column;gap:8px}
form.on{display:flex;animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.bar{display:flex;align-items:flex-end;gap:6px;background:var(--field);border:1px solid var(--edge);border-radius:22px;padding:5px 5px 5px 14px}
textarea,input{font:inherit;font-size:16px;color:var(--fg);background:none;border:0;outline:none;width:100%;resize:none}
textarea{padding:6px 0;max-height:160px;line-height:1.35}
input{background:var(--field);border:1px solid var(--edge);border-radius:22px;padding:9px 14px}
textarea::placeholder,input::placeholder{color:var(--muted)}
.bar:focus-within,input:focus{border-color:color-mix(in srgb,var(--out) 60%,var(--edge))}
.send{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--out);color:#fff;cursor:pointer;display:grid;place-items:center;transition:opacity .2s,transform .15s}
.send:disabled{opacity:.35;cursor:default}
.send:not(:disabled):active{transform:scale(.92)}
.send svg{width:16px;height:16px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

#t{position:fixed;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;transition:color .2s}
#t:hover{color:var(--fg)}
#t svg{width:18px;height:18px}
.moon{display:none}
:root[data-theme=dark] .sun{display:none}:root[data-theme=dark] .moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sun{display:none}:root:not([data-theme=light]) .moon{display:block}}
@media (max-width:520px){
  body{font-size:17px;padding-top:max(88px,14vh)}
  main{max-width:none}
  .b{max-width:82%;padding:8px 13px;border-radius:19px}
  /* Composer pins to the bottom like a messaging app */
  form.on{position:sticky;bottom:0;margin:12px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  body{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){.b,#reply{transition:none}.on .wave,.typing i{animation:none}}
</style>
<noscript><style>.b.in{display:block!important;opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
<button id="t" aria-label="Toggle light and dark mode">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<main id="chat" aria-live="polite">
  <div class="b in">Hi <span class="wave">👋</span></div>
  <div class="b in">I'm Soneesh <span class="say">(so niche)</span></div>
  <div class="b in">I'm a <a href="https://www.capsulelabs.space" target="_blank" rel="noopener">founder</a>, <a href="https://bostonsquareventures.com" target="_blank" rel="noopener">investor</a>, <a href="https://www.linkedin.com/in/soneeshk" target="_blank" rel="noopener">creator</a>, and <a href="https://chapter-two-bice.vercel.app" target="_blank" rel="noopener">philanthropist</a>.</div>
  <div class="b in last">I'm also an <a href="https://www.barnesandnoble.com/w/fasten-your-seatbelt-soneesh-kothagundla/1149310655?ean=9798993879529" target="_blank" rel="noopener">author</a> and <a href="https://scholar.google.com/citations?user=pYouEJ8AAAAJ&amp;hl=en" target="_blank" rel="noopener">researcher</a>.</div>
  <div class="b in" id="sleep" hidden></div>
  <div id="log" style="display:contents"></div>
  <button id="reply" type="button">Text back</button>
  <form id="f" novalidate>
    <input id="email" type="email" name="email" placeholder="Your email (so I can write back)" autocomplete="email" maxlength="254">
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="bar">
      <textarea id="msg" name="message" rows="1" placeholder="Message" maxlength="4000" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <p class="note">Will respond via email</p>
  </form>
</main>
<script>
(function(){
  var root=document.documentElement;
  document.getElementById('t').onclick=function(){
    var d=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches,n=d?'light':'dark';
    root.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}};

  // Public Supabase project + anon key. Row Level Security only lets anon INSERT into site_messages;
  // a database trigger then hands each new message to a Google Apps Script that emails it.
  var SB='https://rciyqllvmbgjmgllezwg.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjaXlxbGx2bWJnam1nbGxlendnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDA0NTEsImV4cCI6MjA5ODk3NjQ1MX0.YSDdfx4xDXDRSK4XBCBsosJUayv2XGrp5i_ji8-jc1Q';
  var chat=document.getElementById('chat'),log=document.getElementById('log'),bubbles=[].slice.call(chat.querySelectorAll('.b.in')),
      reply=document.getElementById('reply'),form=document.getElementById('f'),msg=document.getElementById('msg'),
      email=document.getElementById('email'),send=document.getElementById('send'),
      still=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Play the incoming bubbles like a conversation: typing dots, then the message.
  // Sleep bubble: filled from /api/sleep (Fitbit via Google Health API); stays hidden if unavailable.
  var sleepEl=document.getElementById('sleep');
  fetch('/api/sleep').then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!(d.minutes>0))return;
    var h=Math.floor(d.minutes/60),m=Math.round(d.minutes%60);
    sleepEl.textContent='The amount of sleep I got today: ';
    var n=document.createElement('span');n.style.whiteSpace='nowrap';n.textContent=(h?h+'h ':'')+m+'m';sleepEl.appendChild(n);
    sleepEl.hidden=false;
    var last=chat.querySelector('.b.in.last');if(last)last.classList.remove('last');sleepEl.classList.add('last');
    if(sleepEl.dataset.missed){reveal(sleepEl)}
  }).catch(function(){});
  function reveal(b){b.classList.add('show');requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('on')})})}
  function typing(){var t=document.createElement('div');t.className='b in typing show on';t.innerHTML='<i></i><i></i><i></i>';return t}
  function play(i){
    if(i>=bubbles.length){reply.classList.add('on');return}
    var b=bubbles[i];
    if(b.hidden){b.dataset.missed=1;return play(i+1)}
    if(still||i===0){reveal(b);return setTimeout(function(){play(i+1)},still?0:350)}
    var t=typing();chat.insertBefore(t,b);
    setTimeout(function(){t.remove();reveal(b);setTimeout(function(){play(i+1)},250)},500+Math.min(b.textContent.length*12,700));
  }
  setTimeout(function(){play(0)},still?0:300);

  reply.onclick=function(){reply.style.display='none';form.classList.add('on');(email.value?msg:email).focus({preventScroll:true});
    form.scrollIntoView({block:'end',behavior:still?'auto':'smooth'})};

  function grow(){msg.style.height='auto';msg.style.height=msg.scrollHeight+'px'}
  function valid(){return msg.value.trim().length>0&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())}
  msg.oninput=function(){grow();send.disabled=!valid()};
  email.oninput=function(){send.disabled=!valid()};
  email.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();msg.focus()}};
  msg.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(valid())form.requestSubmit()}};

  function deliver(text,meta){
    meta.className='meta';meta.textContent='Sending…';
    if(form.website.value){meta.textContent='Delivered';return}
    fetch(SB+'/rest/v1/site_messages',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY,Prefer:'return=minimal'},
      body:JSON.stringify({body:text,email:email.value.trim(),user_agent:navigator.userAgent.slice(0,300)})})
      .then(function(r){if(!r.ok)throw 0;meta.textContent='Delivered'})
      .catch(function(){meta.className='meta err';meta.innerHTML='Not delivered · <button type="button">Try again</button>';
        meta.querySelector('button').onclick=function(){deliver(text,meta)}});
  }

  form.onsubmit=function(e){
    e.preventDefault();if(!valid())return;
    var text=msg.value.trim(),prev=log.querySelector('.meta:last-child');
    if(prev&&prev.textContent==='Delivered')prev.remove();
    var b=document.createElement('div');b.className='b out';b.textContent=text;
    var meta=document.createElement('div');log.appendChild(b);log.appendChild(meta);
    requestAnimationFrame(function(){b.classList.add('on')});
    msg.value='';grow();send.disabled=true;email.readOnly=true;
    deliver(text,meta);
    form.scrollIntoView({block:'end',behavior:still?'auto':'smooth'});
  };
})();
</script>
</body>
</html>
